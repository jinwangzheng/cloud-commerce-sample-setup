# you can put key/value pairs here.
# Use Config.getParameter(..) to retrieve the values during runtime.

wsehcache.key=value

# Specifies the location of the spring context file putted automatically to the global platform application context.
wsehcache.application-context=wsehcache-spring.xml

# Enables / disables XSS filter (overrides global settings)
#wsehcache.xss.filter.enabled=false

#Fallback taxcode is returned by DefaultTaxCodeStrategy when it cannot find taxCode for product and taxArea
#Different value can be configure for different base store by adding base store name at the end of property name
externaltax.fallbacktaxcode=PC040100

# For each flow, multiple scopes are supported. Delimiter is ',' e.g. basic,extended
wsehcache.oauth2.password.scope=basic
wsehcache.oauth2.clientCredentials.scope=extended
wsehcache.oauth2.tokenUrl=/authorizationserver/oauth/token

#Logger level set to warn to avoid information about mapping during server start (they could contain Exception string in method signature)
log4j2.logger.commerceHandlerMapping.name = org.training.request.mapping.handler.CommerceHandlerMapping
log4j2.logger.commerceHandlerMapping.level = warn
log4j2.logger.commerceHandlerMapping.appenderRef.stdout.ref = STDOUT

# <v1-api>

wsehcache.v1.api.description=Commerce Webservices Version 1
wsehcache.v1.api.title=Commerce Webservices V1
wsehcache.v1.api.version=1.0

# </v1-api>

wsehcache.v2.api.description=These services manage all of the common commerce functionality, and also include customizations from installed AddOns. The implementing extension is called wsehcache.
wsehcache.v2.api.title=Commerce Webservices
wsehcache.v2.api.version=2.2.1
wsehcache.v2.api.license=Use of this file is subject to the terms of your agreement with SAP SE or its affiliates respecting the use of the SAP product for which this file relates.
wsehcache.v2.api.license.url=
wsehcache.v2.api.oauth.password.scope=basic
wsehcache.v2.api.oauth.clientCredentials.scope=extended
wsehcache.v2.api.oauth.tokenUrl=/authorizationserver/oauth/token

wsehcache.v2.sap.apiType=REST
wsehcache.v2.sap.shortText=Enables you to manage all of the common commerce functionality.
wsehcache.v2.sap.state=Active
wsehcache.v2.sap.servers=default
wsehcache.v2.sap.server.default.url=https://{url}/rest/v2
wsehcache.v2.sap.server.default.description=Commerce Webservices v2 REST API endpoint
wsehcache.v2.sap.server.default.templates.url.description=SAP Commerce Cloud server URL where the application is deployed.

#Use for generating static swagger documentation
wsehcache.documentation.static.generate=true
ext.wsehcache.extension.webmodule.webroot=/rest/v2

#################################
### Jar scanning setup for Tomcat
#################################
wsehcache.tomcat.tld.scan=*jstl-1*.jar
wsehcache.tomcat.tld.default.scan.enabled=false
wsehcache.tomcat.pluggability.scan=*jstl-1*.jar
wsehcache.tomcat.pluggability.default.scan.enabled=false

corsfilter.wsehcache.allowedOrigins=http://localhost:4200 https://localhost:4200
corsfilter.wsehcache.allowedMethods=GET HEAD OPTIONS PATCH PUT POST DELETE
corsfilter.wsehcache.allowedHeaders=origin content-type accept authorization cache-control if-none-match x-anonymous-consents sap-commerce-cloud-user-id

# Use to set if the cart should be refreshed by default or not
wsehcache.cart.refreshed.by.default=false

#Used for specifying compatible site channels for annotated api endpoints restricted by site channel
api.compatibility.b2c.channels=B2C

#Web root for commerce web services - used in CommerceWebServicesPaymentFacade for creating full SOP merchant callback url
webroot.commercewebservices.http=http://localhost:9001/rest
webroot.commercewebservices.https=https://localhost:9002/rest

